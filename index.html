<title>Jira Wiki Markup Live Preview - Free Online Jira Text Formatting Editor</title>

<style>

html, body { height: 100%; margin: 0; }

#bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #c1c7d0; background: #f4f5f7; }
#bar .sep { width: 1px; height: 20px; background: #c1c7d0; margin: 0 4px; }
#bar button, #bar select, #bar input[type=text] { font: inherit; padding: 2px 7px; border: 1px solid #b3bac5; border-radius: 3px; background: #fff; color: #172b4d; }
#bar button { cursor: pointer; min-width: 26px; }
#bar button:hover { background: #ebecf0; }
#bar label { display: inline-flex; align-items: center; gap: 4px; }
#bar input[type=text] { width: 190px; }
#bar #baseUrl { width: 190px; }
#bar .grow { flex: 1; }
#status { color: #5e6c84; min-width: 60px; }
#main { flex: 1; display: flex; min-height: 0; }
#editor { box-sizing: border-box; width: 50%; min-width: 120px; resize: none; border: 0; padding: 12px; margin: 0; outline: none; font: 13px/1.5 Consolas, Menlo, Monaco, "Courier New", monospace; color: #172b4d; tab-size: 4; overflow: auto; }
#divider { width: 6px; cursor: col-resize; background: #dfe1e6; flex: none; }
#divider:hover, #divider.drag { background: #b3bac5; }
#previewWrap { flex: 1; min-width: 120px; overflow: auto; padding: 14px 24px 40px; box-sizing: border-box; }

/* ---------- Jira-like rendering ---------- */
.wiki { font: 14px/1.4285714 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif; color: #172b4d; word-wrap: break-word; }
.wiki > :first-child { margin-top: 0 !important; }
.wiki p { margin: 10px 0 0; }
.wiki h1, .wiki h2, .wiki h3, .wiki h4, .wiki h5, .wiki h6 { color: #172b4d; margin: 20px 0 0; }
.wiki h1 { font-size: 24px; font-weight: 500; line-height: 1.25; letter-spacing: -0.01em; margin-top: 28px; }
.wiki h2 { font-size: 20px; font-weight: 500; line-height: 1.2; letter-spacing: -0.008em; margin-top: 28px; }
.wiki h3 { font-size: 16px; font-weight: 600; line-height: 1.25; letter-spacing: -0.006em; margin-top: 28px; }

.wiki h5 { font-size: 12px; font-weight: 600; line-height: 1.33; margin-top: 20px; }
.wiki h6 { font-size: 11px; font-weight: 600; line-height: 1.27; margin-top: 20px; color: #6b778c; text-transform: uppercase; }
.wiki a { color: #0052cc; text-decoration: none; }
.wiki a:hover { text-decoration: underline; }
.wiki a[name] { color: inherit; }
.wiki tt, .wiki code { font-family: Monaco, Menlo, Consolas, "Courier New", monospace; font-size: 12px; }
.wiki del { text-decoration: line-through; }
.wiki ins { text-decoration: underline; }
.wiki cite { font-style: italic; }
.wiki hr { border: 0; border-top: 1px solid #ccc; height: 0; margin: 15px 0; }
.wiki ul, .wiki ol { margin: 10px 0 0; padding-left: 28px; }
.wiki li > ul, .wiki li > ol { margin-top: 0; }
.wiki ul.alternate { list-style-type: square; }
.wiki li { margin: 0; padding: 0; }
.wiki blockquote { margin: 10px 0 0 10px; padding: 0 0 0 12px; border-left: 1px solid #ccc; color: #707070; }
.wiki blockquote > p:first-child { margin-top: 0; }
.wiki .error { color: #d04437; }
.wiki font { font-family: inherit; }
.wiki .table-wrap { overflow-x: auto; margin: 10px 0 0; }
.wiki table.confluenceTable { border-collapse: collapse; margin: 0; }

.wiki .confluenceTh { background: #f0f0f0; font-weight: bold; }
.wiki .confluenceTd > ul, .wiki .confluenceTd > ol, .wiki .confluenceTh > ul, .wiki .confluenceTh > ol { margin-top: 0; }
.wiki .panel { border: 1px solid #ccc; margin: 10px 0 0; overflow: hidden; background: #fff; }
.wiki .panelHeader { border-bottom: 1px solid #ccc; padding: 10px; background: #f7f7f7; }
.wiki .panelContent { padding: 10px; }
.wiki .panelContent > :first-child { margin-top: 0; }
.wiki .code.panel .panelContent, .wiki .preformatted.panel .panelContent { background: #f5f5f5; }

.wiki .codeContent.has-lines { display: flex; }
.wrapcode .wiki pre:not(.line-numbers) { white-space: pre-wrap; overflow-wrap: anywhere; }
.wrapcode .wiki .has-lines pre.code-body { white-space: pre; overflow: auto; }

.wiki .codeContent.has-lines pre.code-body { flex: 1; min-width: 0; }
.wiki .code-keyword { color: #000091; }
.wiki .code-object { color: #910091; }

<header style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">
  <h1>Jira Wiki Markup Live Preview</h1>

</header>

  <span class="sep"></span>

    <option value="">Heading</option>
    <option value="1">h1</option><option value="2">h2</option><option value="3">h3</option><option value="4">h4</option><option value="5">h5</option><option value="6">h6</option>

  <button data-act="ul" title="Bulleted list  * item">&bull; List</button>
  <button data-act="ol" title="Numbered list  # item">1. List</button>
  <button data-act="bq" title="Block quote  bq. ">bq.</button>
  <button data-act="quote" title="Quote block  {quote}">{quote}</button>
  <button data-act="code" title="Code block  {code:lang}">{code}</button>
  <button data-act="noformat" title="Preformatted  {noformat}">{noformat}</button>
  <button data-act="panel" title="Panel  {panel}">{panel}</button>
  <button data-act="table" title="Table  ||head|| |cell|">Table</button>
  <button data-act="link" title="Link  [label|url]  (Ctrl+K)">Link</button>

  <div id="previewWrap"><div id="preview" class="wiki"></div></div>
</div>

<script id="core">

  pvWrap.addEventListener(ev, function () { active = 'pv'; }, { passive: true });
});
function ratio(el) { var max = el.scrollHeight - el.clientHeight; return max > 0 ? el.scrollTop / max : 0; }
function syncFromEditor() {
  if (!$('syncScroll').checked) return;
  pvWrap.scrollTop = ratio(ed) * (pvWrap.scrollHeight - pvWrap.clientHeight);
}
ed.addEventListener('scroll', function () { if (active === 'ed') syncFromEditor(); });
pvWrap.addEventListener('scroll', function () {
  if (active !== 'pv' || !$('syncScroll').checked) return;
  ed.scrollTop = ratio(pvWrap) * (ed.scrollHeight - ed.clientHeight);
});

/* ---------- divider ---------- */
(function () {
  var div = $('divider'), dragging = false;
  div.addEventListener('mousedown', function (e) { dragging = true; div.classList.add('drag'); e.preventDefault(); });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    var rect = $('main').getBoundingClientRect();
    var w = Math.max(120, Math.min(rect.width - 126, e.clientX - rect.left));
    ed.style.width = w + 'px';
  });
  window.addEventListener('mouseup', function () {
    if (!dragging) return;
    dragging = false; div.classList.remove('drag');
    store.set(KEY_W, parseInt(ed.style.width, 10));
  });
})();

/* ---------- editing helpers ---------- */
function replaceRange(start, end, text, selStart, selEnd) {
  ed.focus();
  ed.setSelectionRange(start, end);
  var ok = false;
  try { ok = document.execCommand('insertText', false, text); } catch (e) {}
  if (!ok) { ed.setRangeText(text, start, end, 'end'); ed.dispatchEvent(new Event('input', { bubbles: true })); }
  if (selStart !== undefined) ed.setSelectionRange(selStart, selEnd === undefined ? selStart : selEnd);
}
function wrap(pre, post, placeholder) {
  var s = ed.selectionStart, e = ed.selectionEnd, sel = ed.value.slice(s, e);
  var inner = sel || placeholder || '';
  replaceRange(s, e, pre + inner + post, s + pre.length, s + pre.length + inner.length);
}
function lineRange() {
  var v = ed.value, s = ed.selectionStart, e = ed.selectionEnd;
  var ls = v.lastIndexOf('\n', s - 1) + 1;
  var le = v.indexOf('\n', e > s && v.charAt(e - 1) === '\n' ? e - 1 : e);
  if (le < 0) le = v.length;
  return [ls, le];
}
function prefixLines(prefix, stripRe) {
  var r = lineRange(), block = ed.value.slice(r[0], r[1]);
  var lines = block.split('\n');
  var allHave = lines.every(function (l) { return !l.trim() || l.indexOf(prefix) === 0; });
  var out = lines.map(function (l) {
    if (!l.trim()) return l;
    if (allHave && !stripRe) return l.slice(prefix.length);
    var base = stripRe ? l.replace(stripRe, '') : l;
    return prefix + base;
  });
  var text = out.join('\n');
  replaceRange(r[0], r[1], text, r[0], r[0] + text.length);
}
function insertBlock(pre, post, placeholder) {
  var s = ed.selectionStart, e = ed.selectionEnd, v = ed.value;
  var sel = v.slice(s, e) || placeholder;
  var lead = (s > 0 && v.charAt(s - 1) !== '\n') ? '\n' : '';
  var trail = (e < v.length && v.charAt(e) !== '\n') ? '\n' : '';
  var text = lead + pre + sel + post + trail;
  var ss = s + lead.length + pre.length;
  replaceRange(s, e, text, ss, ss + sel.length);
}

var ACTIONS = {
  bold: function () { wrap('*', '*', 'bold'); },
  italic: function () { wrap('_', '_', 'italic'); },
  ins: function () { wrap('+', '+', 'underline'); },
  del: function () { wrap('-', '-', 'strike'); },
  mono: function () { wrap('{{', '}}', 'monospace'); },
  sup: function () { wrap('^', '^', 'sup'); },
  sub: function () { wrap('~', '~', 'sub'); },
  cite: function () { wrap('??', '??', 'citation'); },
  ul: function () { prefixLines('* '); },
  ol: function () { prefixLines('# '); },
  bq: function () { prefixLines('bq. '); },
  quote: function () { insertBlock('{quote}\n', '\n{quote}', 'quoted text'); },
  code: function () { insertBlock('{code:java}\n', '\n{code}', 'code here'); },
  noformat: function () { insertBlock('{noformat}\n', '\n{noformat}', 'preformatted text'); },
  panel: function () { insertBlock('{panel:title=Title}\n', '\n{panel}', 'panel text'); },
  table: function () {
    var s = ed.selectionStart, e = ed.selectionEnd, v = ed.value;
    var lead = (s > 0 && v.charAt(s - 1) !== '\n') ? '\n' : '';
    var t = lead + '||Heading 1||Heading 2||\n|Cell 1|Cell 2|\n|Cell 3|Cell 4|\n';
    replaceRange(s, e, t, s + lead.length + 2, s + lead.length + 11);
  },
  link: function () {
    var s = ed.selectionStart, e = ed.selectionEnd, sel = ed.value.slice(s, e);
    if (/^https?:\/\//i.test(sel)) { var t = '[' + sel + ']'; replaceRange(s, e, t, s + t.length); return; }
    var label = sel || 'label', t2 = '[' + label + '|https://]';
    var urlStart = s + label.length + 2;
    replaceRange(s, e, t2, urlStart, urlStart + 8);
  },
  image: function () { wrap('!', '!', 'https://example.com/image.png'); },
  hr: function () { insertBlock('----', '', ''); }
};
Array.prototype.forEach.call(document.querySelectorAll('#bar button[data-act]'), function (b) {
  b.addEventListener('mousedown', function (e) { e.preventDefault(); });
  b.addEventListener('click', function () { ACTIONS[b.getAttribute('data-act')](); });
});
$('colorSel').addEventListener('change', function () {
  var c = this.value; this.selectedIndex = 0;
  if (c) { ed.focus(); wrap('{color:' + c + '}', '{color}', 'colored text'); }
});
$('headSel').addEventListener('change', function () {
  var n = this.value; this.selectedIndex = 0;
  if (n === '') return;
  ed.focus();
  prefixLines(n === '0' ? '' : 'h' + n + '. ', /^h[1-6]\.\s+/);
});
ed.addEventListener('keydown', function (e) {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === 'b') { e.preventDefault(); ACTIONS.bold(); }
  else if (k === 'i') { e.preventDefault(); ACTIONS.italic(); }
  else if (k === 'k') { e.preventDefault(); ACTIONS.link(); }
});

/* ---------- buttons ---------- */
$('btnCopy').addEventListener('click', function () {
  var txt = ed.value;
  function done() { flash('Copied'); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, function () { fallback(); });
  } else fallback();
  function fallback() {
    var cur = [ed.selectionStart, ed.selectionEnd];
    ed.select(); try { document.execCommand('copy'); done(); } catch (e) { flash('Copy failed'); }
    ed.setSelectionRange(cur[0], cur[1]);
  }
});
$('btnClear').addEventListener('click', function () {
  if (ed.value && !confirm('Clear the editor?')) return;
  ed.value = ''; scheduleRender(); scheduleSave(); ed.focus();
});
$('btnSample').addEventListener('click', function () {
  if (ed.value && ed.value !== SAMPLE && !confirm('Replace the editor text with the sample?')) return;
  ed.value = SAMPLE; scheduleRender(); scheduleSave(); ed.scrollTop = 0;
});

/* ---------- init ---------- */
var saved = store.get(KEY_TEXT);
ed.value = saved !== null ? saved : SAMPLE;
render();
ed.focus();
})();
</script>
</body>
</html>
